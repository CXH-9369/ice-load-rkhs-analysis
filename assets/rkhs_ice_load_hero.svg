<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Ice-Load RKHS Analysis</title>
  <desc id="desc">A method banner showing ice contact pressure, an RKHS feature map, and nonlinear mechanics analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#102d45"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.48" stop-color="#71d8f5"/>
      <stop offset="1" stop-color="#3188cf"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de3ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <radialGradient id="pressureHot">
      <stop offset="0" stop-color="#ffde73"/>
      <stop offset="0.38" stop-color="#ff9866"/>
      <stop offset="0.72" stop-color="#8b7cff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#102d45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9feaff" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000814" flood-opacity=".4"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="470" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="470" rx="28" fill="url(#grid)"/>
  <circle cx="1095" cy="225" r="270" fill="#2e7eea" opacity=".08"/>
  <circle cx="1180" cy="160" r="190" fill="#52dcff" opacity=".06"/>

  <g transform="translate(82 77)">
    <text x="0" y="0" fill="#62def5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">NONLINEAR CONTACT MECHANICS</text>
    <text x="0" y="70" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="760" letter-spacing="-2">Ice-Load</text>
    <text x="0" y="133" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="760" letter-spacing="-2">RKHS Analysis</text>
    <text x="2" y="181" fill="#b8cad9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Contact pressure · loading rate · visible fracture</text>
    <rect x="0" y="217" width="496" height="1" fill="#8adcf0" opacity=".28"/>
    <text x="0" y="258" fill="#d8e7f1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Specimen-balanced inference in a nonlinear state space</text>
    <g transform="translate(0 284)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">
      <rect width="86" height="36" rx="18" fill="#113f5d" stroke="#4cd9f1" stroke-opacity=".5"/>
      <text x="43" y="23" fill="#bff5ff" text-anchor="middle">HSIC</text>
      <rect x="98" width="86" height="36" rx="18" fill="#113f5d" stroke="#4cd9f1" stroke-opacity=".5"/>
      <text x="141" y="23" fill="#bff5ff" text-anchor="middle">MMD</text>
      <rect x="196" width="116" height="36" rx="18" fill="#242c61" stroke="#9e91ff" stroke-opacity=".55"/>
      <text x="254" y="23" fill="#ded9ff" text-anchor="middle">Kernel PCA</text>
      <rect x="324" width="150" height="36" rx="18" fill="#242c61" stroke="#9e91ff" stroke-opacity=".55"/>
      <text x="399" y="23" fill="#ded9ff" text-anchor="middle">Exact inference</text>
    </g>
  </g>

  <g transform="translate(705 40)" filter="url(#shadow)">
    <!-- ice specimen -->
    <polygon points="50,110 238,72 342,134 153,176" fill="#b9eff8" opacity=".9"/>
    <polygon points="50,110 153,176 153,361 50,292" fill="#5fb6da" opacity=".72"/>
    <polygon points="153,176 342,134 342,318 153,361" fill="url(#ice)" opacity=".82"/>
    <path d="M185 170 L222 225 L196 265 L251 319 M286 149 L258 207 L302 250 L274 335" fill="none" stroke="#f7feff" stroke-opacity=".72" stroke-width="3"/>
    <path d="M153 176 L342 134" stroke="#ffffff" stroke-opacity=".8" stroke-width="2"/>

    <!-- contact pressure field -->
    <g transform="translate(52 76) skewY(-11)">
      <rect width="289" height="74" rx="5" fill="#071a2b" stroke="#8de9f9" stroke-opacity=".6"/>
      <ellipse cx="82" cy="38" rx="78" ry="55" fill="url(#pressureHot)"/>
      <ellipse cx="223" cy="32" rx="64" ry="46" fill="url(#pressureHot)" opacity=".76"/>
      <g stroke="#bdf7ff" stroke-opacity=".18" stroke-width=".8">
        <path d="M36 0V74M72 0V74M108 0V74M144 0V74M180 0V74M216 0V74M252 0V74"/>
        <path d="M0 18H289M0 37H289M0 56H289"/>
      </g>
    </g>

    <!-- mapping arrow -->
    <path d="M378 225 C430 188 449 168 496 155" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M488 147 L505 153 L492 165" fill="none" stroke="#8e84ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="413" y="188" fill="#aeefff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">φ(x)</text>

    <!-- RKHS manifold -->
    <g transform="translate(505 76)">
      <ellipse cx="105" cy="155" rx="118" ry="148" fill="#172b53" stroke="#8c81ff" stroke-width="2" stroke-opacity=".65"/>
      <path d="M22 197 C62 93 128 84 189 132" fill="none" stroke="#58e0f5" stroke-width="3" opacity=".8"/>
      <path d="M36 229 C85 146 145 145 201 183" fill="none" stroke="#9e91ff" stroke-width="2.4" opacity=".7"/>
      <g fill="#62e0f5" filter="url(#glow)">
        <circle cx="48" cy="195" r="5"/><circle cx="71" cy="153" r="5"/><circle cx="99" cy="125" r="5"/><circle cx="132" cy="116" r="5"/><circle cx="164" cy="128" r="5"/>
      </g>
      <g fill="#aa9dff">
        <circle cx="68" cy="219" r="5"/><circle cx="101" cy="188" r="5"/><circle cx="137" cy="174" r="5"/><circle cx="174" cy="178" r="5"/>
      </g>
      <circle cx="132" cy="116" r="17" fill="none" stroke="#ffcf70" stroke-width="2.5" stroke-dasharray="4 5"/>
      <text x="105" y="333" text-anchor="middle" fill="#dbe5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="720">RKHS state geometry</text>
      <text x="105" y="359" text-anchor="middle" fill="#9fb6d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">transition · separation · regimes</text>
    </g>
  </g>

  <text x="82" y="438" fill="#7894aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.5">METHOD CODE · EXACT SPECIMEN-LEVEL STATISTICS · REPRODUCIBLE RESEARCH</text>
</svg>
